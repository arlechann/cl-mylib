name: Test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LISP: sbcl-bin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Common Lisp
        uses: 40ants/setup-lisp@v4
        with:
          asdf-system: mylib

      - name: Run tests
        uses: 40ants/run-tests@v2
        with:
          asdf-system: mylib
